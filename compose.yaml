services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: assetcare
      POSTGRES_USER: assetcare
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetcare -d assetcare"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/assetcare
      DB_USERNAME: assetcare
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_TECHNICIAN_PASSWORD: ${DEMO_TECHNICIAN_PASSWORD:-}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
